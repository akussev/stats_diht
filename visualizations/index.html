<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Интерактивные визуализации по статистике">
  <title>Визуализации</title>
  <style>
    :root {
      --ink: #16243d;
      --muted: #69768d;
      --paper: #f4f1eb;
      --card: #fffdf9;
      --line: rgba(22, 36, 61, .10);
      --teal: #22b89b;
      --shadow: 0 24px 60px rgba(31, 41, 55, .09);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% -8%, rgba(242, 167, 67, .18), transparent 32rem),
        radial-gradient(circle at 96% 18%, rgba(34, 184, 155, .11), transparent 28rem),
        var(--paper);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: min(960px, calc(100% - 40px));
      margin: 0 auto;
      padding: clamp(42px, 8vw, 92px) 0;
    }

    h1 {
      margin: 0 0 34px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(42px, 7vw, 72px);
      font-weight: 500;
      line-height: .98;
      letter-spacing: -.035em;
    }

    .card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
      min-height: 180px;
      padding: clamp(26px, 5vw, 44px);
      border: 1px solid var(--line);
      border-radius: 22px;
      color: inherit;
      background: var(--card);
      box-shadow: var(--shadow);
      text-decoration: none;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: rgba(34, 184, 155, .42);
      box-shadow: 0 30px 70px rgba(31, 41, 55, .13);
    }

    .card:focus-visible {
      outline: 3px solid rgba(79, 114, 232, .25);
      outline-offset: 4px;
    }

    .card-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(28px, 4vw, 42px);
      line-height: 1.08;
    }

    .arrow {
      display: grid;
      place-items: center;
      width: 52px;
      height: 52px;
      flex: 0 0 52px;
      border-radius: 50%;
      color: #fff;
      background: var(--teal);
      font-size: 27px;
      line-height: 1;
      transition: transform .18s ease;
    }

    .card:hover .arrow { transform: translateX(3px); }

    @media (max-width: 520px) {
      main { width: min(100% - 24px, 960px); }
      .card { min-height: 150px; }
      .arrow { width: 46px; height: 46px; flex-basis: 46px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .card, .arrow { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Визуализации</h1>
    <a class="card" href="./confidence-intervals/">
      <span class="card-title">Доверительные интервалы</span>
      <span class="arrow" aria-hidden="true">→</span>
    </a>
  </main>
</body>
</html>
